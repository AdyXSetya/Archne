    if (!info || typeof info.path !== 'string' || info.path.indexOf('/data/') !== 0 && info.path.indexOf('/storage/') !== 0) return;
    var ext = (info.path.split('.').pop() || '').toLowerCase(), mime = MIME[ext] || 'application/octet-stream';
    var sub = typeof info.sub === 'string' ? info.sub : ''; // subfolder di dalam Download (Kirim Langsung: file_transfer/...)
    nat('ArchneDownloads', 'save', { path: info.path, name: info.name, mime: mime, sub: sub }).then(
      function (r) { tell({ archne: 'native-saved', name: String((r && r.name) || info.name), dir: sub }); },
      function (er) { tell({ archne: 'native-error', err: T('saveFail', { e: nerr(er) || T('unknown') }) }); });
  }

  function boot() {
    var Node = plug('Nodejs');
    if (!Node) { show(T('nodeFail', { e: T('noPlugin') })); return; }
    // Nama event aplikasi berawalan "archne:" agar tidak bentrok dengan event bawaan plugin (ready/message).
    Node.addListener('message', function (e) {
      var n = e && e.eventName, a = (e && e.args) || [];
      if (n === 'archne:ready') onReady(a[0]);
      else if (n === 'archne:saved') onSaved(a[0]);
      else if (n === 'archne:arcpick') arcPick();
      else if (n === 'archne:fatal') show(T('fatal', { m: a[0] }));
    }).catch(function (er) { show(T('nodeFail', { e: emsg(er) })); });
    // Node dimulai otomatis (startMode auto). Pesan 'ready' yang terkirim sebelum pendengar terpasang hilang, juga saat aplikasi dibuka
    // ulang selagi inti Node masih hidup: karena itu halaman menanyakan port dan token tiap detik sampai dijawab.
    var hello = setInterval(function () {
      if (ready) { clearInterval(hello); return; }
      try { Node.send({ eventName: 'archne:hello', args: ['hi'] }).catch(noop); } catch (x) {}
    }, 1000);
    setTimeout(function () { if (!ready) show(T('noReply')); }, 25000);
    var A = plug('App');
    if (A) {
      // Aplikasi ke latar belakang / kembali: UI diberi tahu (Android memutus kamera di latar belakang, jadi kamera channel dimatikan sebelum membeku).
      // Masuk Picture-in-Picture juga memicu pause, tetapi aplikasi masih tampil (jendela kecil): jangan dilaporkan ke latar belakang.
      // Jadi 'background' dikirim setelah jeda singkat, dan hanya bila PiP tidak aktif.
      A.addListener('pause', function () {
        paused = true;
        setTimeout(function () {
          if (!paused) return;
          nat('ArchneBackground', 'pipState').then(function (r) { if (!(r && r.on === true)) tellApp('background'); }, function () { tellApp('background'); });
        }, 400);
      }).catch(noop);
      // Tombol Kembali perangkat (mendengarkan peristiwa ini mematikan perilaku bawaan, jadi diatur di sini): UI dulu (tutup dialog, kecilkan panggilan),
      // lalu riwayat (chat -> daftar, penampil gambar; riwayat iframe ikut riwayat halaman ini), terakhir aplikasi disembunyikan, tidak ditutup (layanan latar tetap hidup).
      A.addListener('backButton', function (ev) {
        var can = !!(ev && ev.canGoBack);
        askBack(function (used) {
          if (used) return;
          if (can) { try { window.history.back(); } catch (x) {} return; }
          if (typeof A.minimizeApp === 'function') A.minimizeApp().catch(noop); else if (typeof A.exitApp === 'function') A.exitApp().catch(noop);
        });
      }).catch(noop);
      A.addListener('resume', function () { paused = false; setTimeout(openTappedChat, 300); tellApp('foreground'); }).catch(noop);
    }
    // Kabar PiP lewat dua jalur (listener plugin dan kejadian window dari MainActivity); pipEvt membuang kabar ganda.
    // Jendela PiP ditutup TIDAK dianggap latar belakang: kamera dibiarkan (Android yang menentukan).
    var P = plug('ArchneBackground');
    if (P && typeof P.addListener === 'function') {
      try {
        var h = P.addListener('pip', function (e) { pipEvt(!!(e && e.on)); });
        if (h && typeof h.catch === 'function') h.catch(noop);
      } catch (x) {}
    }
    try { window.addEventListener('archnepip', function (e) { pipEvt(!!(e && e.on)); }); } catch (x) {}
  }

  // Ketukan pada notifikasi: buka chat yang bersangkutan di UI. Tombol "Jawab" di notifikasi panggilan: UI diminta menjawab panggilan itu.
  function openTappedChat() {
    if (!ready) return;
    nat('ArchneBackground', 'takeChat').then(function (r) { var key = r && r.key; if (key) tell({ archne: 'open-chat', key: String(key) }); }, noop);
    nat('ArchneBackground', 'takeAnswer').then(function (r) { var cid = r && r.cid; if (cid) startAnswer(String(cid)); }, noop);
  }
  // "Jawab" dari notifikasi: pesan ke UI dikirim ULANG sampai UI mengaku sudah menjawab ('answer-done') atau 20 dtk lewat. Satu kali kirim saja bisa hilang
  // bila Android mematikan WebView saat game di depan dan UI sedang dimuat ulang (pengguna lalu harus menekan Terima lagi).
  var ansCid = null, ansUntil = 0, ansTimer = null;
  function pushAnswer() { if (!ansCid || Date.now() > ansUntil) { stopAnswer(); return; } tell({ archne: 'answer-call', cid: ansCid }); }
  function stopAnswer() { ansCid = null; if (ansTimer) { clearInterval(ansTimer); ansTimer = null; } }
  function startAnswer(cid) { ansCid = cid; ansUntil = Date.now() + 20000; pushAnswer(); if (!ansTimer) ansTimer = setInterval(pushAnswer, 700); }

  // Audio panggilan suara lewat plugin ArchneAudio. UI (iframe) minta: hello (tanya kemampuan), mic (izin RECORD_AUDIO), cam (izin CAMERA),
  // call-begin / call-end (mode panggilan + layanan latar), speaker (rute suara). Jawaban selalu { native-reply, id, ok, res }.
  var AUDIO_ACT = { hello: 'hello', mic: 'mic', cam: 'cam', 'call-begin': 'begin', 'call-end': 'end', speaker: 'speaker' };
  function audioAsk(d) {
    if (d.action === 'hello') { tellCaps(); return; }
    if (typeof d.id !== 'number' || !isFinite(d.id)) return;
    var reply = function (ok, res) { tell({ archne: 'native-reply', id: d.id, ok: ok, res: res }); };
    nat('ArchneAudio', AUDIO_ACT[d.action], d.action === 'speaker' ? { on: d.on === true } : {}).then(
      function (r) { var v = r && r.value; reply(d.action === 'mic' || d.action === 'cam' ? v === 'granted' : true, v == null ? '' : String(v)); },
      function (er) { reply(false, emsg(er) || 'error'); });
  }
  // Kirim Langsung dari HP: pilih berkas dengan path aslinya (plugin ArchneDownloads). Jawaban { native-pick, id, ok, paths | code: perm|cancel|err, err }.
  // d.skip = pengguna sudah pernah diminta izin: lanjut memilih walau izin belum ada (berkas yang tak terbaca disalin).
  function dxPick(d) {
    var say = function (o) { o.archne = 'native-pick'; o.id = d.id; tell(o); };
    if (typeof d.id !== 'number' || !isFinite(d.id)) return;
    if (!dxoutRoot || typeof d.job !== 'string' || !/^[A-Za-z0-9_-]{1,40}$/.test(d.job)) { say({ ok: false, code: 'err', err: T('na') }); return; }
    var go = function () {
      nat('ArchneDownloads', 'pick', { root: dxoutRoot, job: d.job }).then(
        function (r) { var list = r && r.paths; say({ ok: true, paths: Array.isArray(list) ? list.filter(function (p) { return typeof p === 'string'; }) : [] }); },
        function (er) { say({ ok: false, code: emsg(er) === 'cancel' ? 'cancel' : 'err', err: emsg(er) === 'noplugin' ? T('noPlugin') : nerr(er) }); });
    };
    var ask = function () { var done = function () { say({ ok: false, code: 'perm' }); }; nat('ArchneDownloads', 'askAccess').then(done, done); };
    nat('ArchneDownloads', 'access').then(function (r) { if ((r && r.value) === 'ok' || d.skip === true) go(); else ask(); }, function () { go(); });
  }
  // Tombol Kembali: tanya UI di iframe apakah ia menanganinya. Tanpa jawaban dalam 300 ms (UI belum dimuat / macet) dianggap tidak.
  var backId = 0, backCb = null, backTm = null;
  function askBack(cb) {
    if (backCb) { var old = backCb; backCb = null; clearTimeout(backTm); old(true); } // tekanan beruntun: yang lama dianggap selesai
    if (!ready) { cb(false); return; }
    var id = ++backId;
    backCb = function (used) { cb(used); };
    backCb.id = id;
    backTm = setTimeout(function () { if (backCb && backCb.id === id) { var f = backCb; backCb = null; f(false); } }, 300);
    tell({ archne: 'native-app', state: 'back', id: id });
  }
  function backResult(d) {
    if (!backCb || backCb.id !== d.id) return;
    var f = backCb; backCb = null; clearTimeout(backTm); f(d.on === true);
  }
  // Impor arsip Halaman: Node meminta pemilih berkas sistem (satu berkas); jalurnya (asli atau salinan sementara) dikirim balik. Batal / gagal = jalur kosong.
  function arcPick() {
    var back = function (p) { try { plug('Nodejs').send({ eventName: 'archne:arcpicked', args: [{ path: p }] }).catch(noop); } catch (x) {} };
    if (!dxoutRoot) { back(''); return; }
    nat('ArchneDownloads', 'pick', { root: dxoutRoot, job: 'arcimp', multiple: false }).then(
      function (r) { var l = r && r.paths; back(Array.isArray(l) && typeof l[0] === 'string' ? l[0] : ''); },
      function (er) { back(''); if (emsg(er) !== 'cancel') tell({ archne: 'native-error', err: T('pickFail', { e: nerr(er) || T('unknown') }) }); });
  }
  // Tautan web dari chat: dibuka di Chrome Custom Tabs (@capacitor/browser; UI Mundur/Maju/Tutup milik sistem). Tanpa plugin: peramban sistem.
  // Hanya http(s) dan paling panjang 2048 karakter yang diteruskan.
  function openWeb(d) {
    var u = typeof d.url === 'string' ? d.url : '';
    if (!/^https?:\/\/[^\s]+$/i.test(u) || u.length > 2048) return;
    nat('Browser', 'open', { url: u }).catch(function () { try { window.open(u, '_system'); } catch (y) {} });
  }
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!origin || e.origin !== origin || e.source !== frame.contentWindow) return;
    if (d && d.archne === 'native' && d.action === 'lang') { // UI mengganti bahasa: teks pembungkus + teks native (notifikasi) ikut
      setLang(d.lang);
      nat('ArchneBackground', 'setLang', { lang: lang }).catch(noop);
      return;
    }
    if (d && d.archne === 'answer-done') { stopAnswer(); return; }
    if (d && d.archne === 'native' && d.action === 'back-result') { backResult(d); return; }
    if (d && d.archne === 'native' && d.action === 'weburl') { openWeb(d); return; }
    if (d && d.archne === 'native' && d.action === 'pip') { nat('ArchneBackground', 'pip', { on: d.on === true }).catch(noop); return; } // siaga Picture-in-Picture (panggilan video aktif)
    if (d && d.archne === 'native' && d.action === 'dxpick') { dxPick(d); return; }
    if (d && d.archne === 'native' && AUDIO_ACT.hasOwnProperty(d.action)) { audioAsk(d); return; }
    if (d && d.archne === 'native' && d.action === 'battery') { // tombol "Jaga tetap aktif" di menu UI
      var say = function (t) { tell({ archne: 'native-info', text: t }); };
      nat('ArchneBackground', 'batteryAsk', { manual: true }).then(function (r) { var v = r && r.value; say(v === 'ok' ? T('battOk') : v === 'asked' ? T('battAsk') : T('battManual')); }, function () { say(T('battFail')); });
      return;
    }
    // Tindakan bawaan perangkat dari UI (iframe): buka berkas hasil unduhan. Hanya dari iframe kita sendiri, hanya path di penyimpanan aplikasi.
    if (!d || d.archne !== 'native' || typeof d.path !== 'string') return;
    if (d.path.indexOf('/data/') !== 0 && d.path.indexOf('/storage/') !== 0) return;
    var ext = (d.path.split('.').pop() || '').toLowerCase(), mime = MIME[ext] || '*/*';
    nat('ArchneDownloads', d.action === 'show' ? 'openWith' : 'open', { path: d.path, mime: mime }).catch(function (er) {
      var m = emsg(er); tell({ archne: 'native-error', err: !m || m === 'noplugin' || m === 'noapp' ? T('noApp') : nerr(er) });
    });
  });
  boot();
})();
</script>
</body></html>
