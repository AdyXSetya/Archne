<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' gap: data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; frame-src http://127.0.0.1:*; img-src 'self' data:">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Archne</title>
<style>
html,body{margin:0;height:100%;background:#0e141b;color:#e6e9ee;font:15px/1.5 system-ui,sans-serif}
#f{position:fixed;inset:0;width:100%;height:100%;border:0;display:none;background:#0e141b}
#msg{padding:28px 22px;white-space:pre-wrap}
</style></head><body>
<div id="msg">Starting Archne...</div>
<iframe id="f" allow="clipboard-write; microphone; camera; autoplay" title="Archne"></iframe>
<script src="cordova.js"></script>
<script>
(function () {
  var msg = document.getElementById('msg'), frame = document.getElementById('f'), origin = null, ready = false, dxoutRoot = null;
  // Bahasa halaman pembungkus (di luar iframe; i18n renderer tidak sampai ke sini). Sumber: bahasa aplikasi di Core, dikirim inti Node lewat 'ready'
  // (info.lang) dan lewat pesan 'lang' dari UI saat pengguna menggantinya. Disimpan di localStorage 'lc.lang' agar teks sebelum inti siap (Memulai..., galat)
  // memakai bahasa terakhir. Bawaan en. Kunci en dan id HARUS sama (dijaga test/i18n.js).
  var W = {
    en: {
      start: 'Starting Archne...',
      saveFail: 'Could not copy to the Download folder: {e}', saveFail2: 'Could not copy to the Download folder', unknown: 'unknown',
      fatal: 'The Archne core failed to start:\n\n{m}\n\nSee logcat (tag NODEJS-MOBILE) for details.',
      nodeFail: 'Node failed to run: {e}',
      noReply: 'The Archne core has not responded after 25 seconds.\nClose the app and open it again. If it keeps happening, check logcat (tag NODEJS-MOBILE).',
      na: 'not available', noPlugin: 'plugin missing', close: 'Close',
      battOk: 'Already excluded from battery optimization.', battAsk: 'Choose Allow so Archne keeps running while the screen is off.',
      battManual: 'Could not open the battery settings. Set it manually: Settings > Apps > Archne > Battery > Unrestricted.', battFail: 'Could not open the battery settings.',
      noApp: 'No app can open this file',
      e_permDenied: 'Storage permission was denied', e_badArgs: 'Invalid arguments', e_tmpDir: 'Could not create the temporary folder', e_readPick: 'Could not read the selected file',
      e_storageFull: 'Phone storage is full', e_srcGone: 'The source file no longer exists', e_mediaDenied: 'Android refused to create the file', e_writeDl: 'Could not write to Download',
      e_dlDir: 'Could not create the Download folder', e_tooMany: 'Too many files with the same name'
    },
    id: {
      start: 'Memulai Archne...',
      saveFail: 'Gagal menyalin ke folder Download: {e}', saveFail2: 'Gagal menyalin ke folder Download', unknown: 'tidak diketahui',
      fatal: 'Inti Archne gagal dimulai:\n\n{m}\n\nLihat logcat (tag NODEJS-MOBILE) untuk detail.',
      nodeFail: 'Node gagal dijalankan: {e}',
      noReply: 'Inti Archne belum menjawab setelah 25 detik.\nTutup aplikasi lalu buka lagi. Bila tetap begini, lihat logcat (tag NODEJS-MOBILE).',
      na: 'tidak tersedia', noPlugin: 'plugin tidak ada', close: 'Tutup',
      battOk: 'Sudah dikecualikan dari penghematan baterai.', battAsk: 'Pilih Izinkan agar Archne tetap aktif saat layar mati.',
      battManual: 'Tidak bisa membuka pengaturan baterai. Atur manual: Pengaturan > Aplikasi > Archne > Baterai > Tanpa batasan.', battFail: 'Tidak bisa membuka pengaturan baterai.',
      noApp: 'Tidak ada aplikasi untuk membuka berkas ini',
      e_permDenied: 'izin penyimpanan ditolak', e_badArgs: 'argumen tidak sah', e_tmpDir: 'folder sementara tidak bisa dibuat', e_readPick: 'tidak bisa membaca berkas pilihan',
      e_storageFull: 'Penyimpanan HP penuh', e_srcGone: 'berkas sumber tidak ada', e_mediaDenied: 'MediaStore menolak membuat berkas', e_writeDl: 'tidak bisa menulis ke Download',
      e_dlDir: 'folder Download tidak bisa dibuat', e_tooMany: 'terlalu banyak berkas bernama sama'
    }
  };
  var lang = 'en';
  try { if (localStorage.getItem('lc.lang') === 'id') lang = 'id'; } catch (x) {}
  function T(k, p) { var t = (W[lang] || W.en)[k]; if (t == null) t = W.en[k]; if (t == null) return k; if (p) for (var n in p) t = t.split('{' + n + '}').join(String(p[n])); return t; }
  // Galat plugin ArchneDownloads: kode "e:<nama>" -> teks bahasa aplikasi; selain itu (pesan sistem, kosong) apa adanya.
  function nerr(er) { var m = /^e:(\w+)$/.exec(String(er == null ? '' : er)); return m && (W[lang] || W.en)['e_' + m[1]] != null ? T('e_' + m[1]) : String(er == null ? '' : er); }
  function setLang(l) {
    l = l === 'id' ? 'id' : 'en';
    lang = l; try { document.documentElement.lang = l; } catch (x) {}
    try { if (l === 'id') localStorage.setItem('lc.lang', 'id'); else localStorage.removeItem('lc.lang'); } catch (x) {}
    if (!ready) msg.textContent = T('start');
  }
  setLang(lang);
  function show(t) { msg.textContent = t; msg.style.display = 'block'; frame.style.display = 'none'; }

  document.addEventListener('deviceready', function () {
    nodejs.channel.on('ready', function (info) {
      if (ready) return;
      ready = true;
      setLang(info && info.lang);
      // layanan latar depan (agar tetap tersambung saat aplikasi di belakang) + notifikasi pesan masuk
      try { cordova.exec(function () {}, function () {}, 'ArchneBackground', 'start', [info.port, info.token, lang]); } catch (x) {}
      // Minta pengecualian penghematan baterai (sekali saja; jeda agar tidak bertumpuk dengan dialog izin notifikasi Android 13+).
      setTimeout(function () { try { cordova.exec(function () {}, function () {}, 'ArchneBackground', 'batteryAsk', [false]); } catch (x) {} }, 5000);
      origin = 'http://127.0.0.1:' + info.port;
      dxoutRoot = typeof info.dxout === 'string' ? info.dxout : null; // folder salinan sementara Kirim Langsung (dihapus inti Node)
      frame.onload = function () { msg.style.display = 'none'; frame.style.display = 'block'; tellCaps(); setTimeout(openTappedChat, 900); };
      frame.src = origin + '/s/' + info.token + '/'; // sesi lewat jalur URL: iframe lintas situs tidak bisa memakai cookie di WebView
    });
    // Berkas selesai diterima: salin ke folder Download publik lewat plugin lokal ArchneDownloads (MediaStore di Android 10+).
    nodejs.channel.on('saved', function (info) {
      if (!info || typeof info.path !== 'string' || info.path.indexOf('/data/') !== 0 && info.path.indexOf('/storage/') !== 0) return;
      var ext = (info.path.split('.').pop() || '').toLowerCase(), mime = MIME[ext] || 'application/octet-stream';
      var sub = typeof info.sub === 'string' ? info.sub : ''; // subfolder di dalam Download (Kirim Langsung: file_transfer/...)
      var tell = function (m) { try { frame.contentWindow.postMessage(m, origin); } catch (x) {} };
      try {
        cordova.exec(function (name) { tell({ archne: 'native-saved', name: String(name || info.name), dir: sub }); },
          function (er) { tell({ archne: 'native-error', err: T('saveFail', { e: nerr(er) || T('unknown') }) }); },
          'ArchneDownloads', 'save', [info.path, info.name, mime, sub]);
      } catch (x) { tell({ archne: 'native-error', err: T('saveFail2') }); }
    });
    nodejs.channel.on('fatal', function (m) { show(T('fatal', { m: m })); });
    // Bila aplikasi dibuka ulang saat inti Node masih hidup (layanan latar depan), start() menolak; cukup tanyakan ulang port dan token.
    nodejs.start('main.js', function (err) { if (err && !/already/i.test(String(err))) show(T('nodeFail', { e: err })); });
    var hello = setInterval(function () { if (ready) { clearInterval(hello); return; } try { nodejs.channel.post('hello', 'hi'); } catch (x) {} }, 1000);
    setTimeout(function () { if (!ready) show(T('noReply')); }, 25000);
  }, false);

  // Ketukan pada notifikasi: buka chat yang bersangkutan di UI. Tombol "Jawab" di notifikasi panggilan: UI diminta menjawab panggilan itu.
  function openTappedChat() {
    if (!ready || !window.cordova) return;
    try {
      cordova.exec(function (key) { if (key) try { frame.contentWindow.postMessage({ archne: 'open-chat', key: String(key) }, origin); } catch (x) {} },
        function () {}, 'ArchneBackground', 'takeChat', []);
    } catch (x) {}
    try {
      cordova.exec(function (cid) { if (cid) try { frame.contentWindow.postMessage({ archne: 'answer-call', cid: String(cid) }, origin); } catch (x) {} },
        function () {}, 'ArchneBackground', 'takeAnswer', []);
    } catch (x) {}
  }
  document.addEventListener('resume', function () { setTimeout(openTappedChat, 300); }, false);
  // Aplikasi ke latar belakang / kembali: UI diberi tahu (Android memutus kamera di latar belakang, jadi kamera channel dimatikan sebelum membeku).
  function tellApp(state) { try { frame.contentWindow.postMessage({ archne: 'native-app', state: state }, origin); } catch (x) {} }
  document.addEventListener('pause', function () { tellApp('background'); }, false);
  document.addEventListener('resume', function () { tellApp('foreground'); }, false);

  // Tindakan bawaan perangkat dari UI (iframe): buka berkas hasil unduhan. Hanya dari iframe kita sendiri, hanya path di penyimpanan aplikasi.
  var MIME = { pdf: 'application/pdf', png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', gif: 'image/gif', webp: 'image/webp', mp4: 'video/mp4', mkv: 'video/x-matroska',
    mp3: 'audio/mpeg', m4a: 'audio/mp4', ogg: 'audio/ogg', wav: 'audio/wav', txt: 'text/plain', csv: 'text/csv', zip: 'application/zip', json: 'application/json',
    doc: 'application/msword', docx: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
    xls: 'application/vnd.ms-excel', xlsx: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
    ppt: 'application/vnd.ms-powerpoint', pptx: 'application/vnd.openxmlformats-officedocument.presentationml.presentation' };
  // Audio panggilan suara lewat plugin ArchneAudio. UI (iframe) minta: hello (tanya kemampuan), mic (izin RECORD_AUDIO), cam (izin CAMERA),
  // call-begin / call-end (mode panggilan + layanan latar), speaker (rute suara). Jawaban selalu { native-reply, id, ok, res }.
  var AUDIO_ACT = { hello: 'hello', mic: 'mic', cam: 'cam', 'call-begin': 'begin', 'call-end': 'end', speaker: 'speaker' };
  function tellCaps() { try { frame.contentWindow.postMessage({ archne: 'native-caps', audio: true, pick: !!dxoutRoot }, origin); } catch (x) {} }
  function audioAsk(d) {
    if (d.action === 'hello') { tellCaps(); return; }
    if (typeof d.id !== 'number' || !isFinite(d.id)) return;
    var reply = function (ok, res) { try { frame.contentWindow.postMessage({ archne: 'native-reply', id: d.id, ok: ok, res: res }, origin); } catch (x) {} };
    try {
      cordova.exec(function (r) { reply(d.action === 'mic' || d.action === 'cam' ? r === 'granted' : true, r == null ? '' : String(r)); },
        function (er) { reply(false, String(er || 'error')); },
        'ArchneAudio', AUDIO_ACT[d.action], d.action === 'speaker' ? [d.on === true] : []);
    } catch (x) { reply(false, 'noplugin'); }
  }
  // Kirim Langsung dari HP: pilih berkas dengan path aslinya (plugin ArchneDownloads). Jawaban { native-pick, id, ok, paths | code: perm|cancel|err, err }.
  // d.skip = pengguna sudah pernah diminta izin: lanjut memilih walau izin belum ada (berkas yang tak terbaca disalin).
  function dxPick(d) {
    var say = function (o) { o.archne = 'native-pick'; o.id = d.id; try { frame.contentWindow.postMessage(o, origin); } catch (x) {} };
    if (typeof d.id !== 'number' || !isFinite(d.id)) return;
    if (!dxoutRoot || typeof d.job !== 'string' || !/^[A-Za-z0-9_-]{1,40}$/.test(d.job)) { say({ ok: false, code: 'err', err: T('na') }); return; }
    var go = function () {
      try {
        cordova.exec(function (list) { say({ ok: true, paths: Array.isArray(list) ? list.filter(function (p) { return typeof p === 'string'; }) : [] }); },
          function (er) { say({ ok: false, code: String(er) === 'cancel' ? 'cancel' : 'err', err: nerr(er) }); },
          'ArchneDownloads', 'pick', [dxoutRoot, d.job]);
      } catch (x) { say({ ok: false, code: 'err', err: T('noPlugin') }); }
    };
    var ask = function () {
      var done = function () { say({ ok: false, code: 'perm' }); };
      try { cordova.exec(done, done, 'ArchneDownloads', 'askAccess', []); } catch (x) { go(); }
    };
    try { cordova.exec(function (r) { if (r === 'ok' || d.skip === true) go(); else ask(); }, function () { go(); }, 'ArchneDownloads', 'access', []); } catch (x) { go(); }
  }
  // Tautan web dari chat (v0.25.1): dibuka di peramban dalam aplikasi (cordova-plugin-inappbrowser). Bilah bawaannya punya Tutup, Mundur, Maju
  // dan tombol Kembali perangkat mundur dulu baru menutup, jadi iklan yang mengalihkan halaman bisa dikembalikan. Tanpa plugin: peramban sistem.
  // Hanya http(s) dan paling panjang 2048 karakter yang diteruskan.
  function openWeb(d) {
    var u = typeof d.url === 'string' ? d.url : '';
    if (!/^https?:\/\/[^\s]+$/i.test(u) || u.length > 2048) return;
    try {
      var iab = window.cordova && cordova.InAppBrowser;
      if (iab && iab.open) iab.open(u, '_blank', 'location=yes,hidenavigationbuttons=no,hideurlbar=no,hardwareback=yes,zoom=no,clearcache=yes,clearsessioncache=yes,closebuttoncaption=' + T('close') + ',toolbarcolor=#0e141b,navigationbuttoncolor=#ffffff,closebuttoncolor=#ffffff,hidespinner=no');
      else window.open(u, '_system');
    } catch (x) { try { window.open(u, '_system'); } catch (y) {} }
  }
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!origin || e.origin !== origin || e.source !== frame.contentWindow) return;
    if (d && d.archne === 'native' && d.action === 'lang') { // UI mengganti bahasa: teks pembungkus + teks native (notifikasi) ikut
      setLang(d.lang);
      try { cordova.exec(function () {}, function () {}, 'ArchneBackground', 'setLang', [lang]); } catch (x) {}
      return;
    }
    if (d && d.archne === 'native' && d.action === 'weburl') { openWeb(d); return; }
    if (d && d.archne === 'native' && d.action === 'dxpick') { dxPick(d); return; }
    if (d && d.archne === 'native' && AUDIO_ACT.hasOwnProperty(d.action)) { audioAsk(d); return; }
    if (d && d.archne === 'native' && d.action === 'battery') { // tombol "Jaga tetap aktif" di menu UI
      var say = function (t) { try { frame.contentWindow.postMessage({ archne: 'native-info', text: t }, origin); } catch (x) {} };
      try {
        cordova.exec(function (r) { say(r === 'ok' ? T('battOk') : r === 'asked' ? T('battAsk') : T('battManual')); },
          function () { say(T('battFail')); }, 'ArchneBackground', 'batteryAsk', [true]);
      } catch (x) { say(T('battFail')); }
      return;
    }
    if (!d || d.archne !== 'native' || typeof d.path !== 'string') return;
    if (d.path.indexOf('/data/') !== 0 && d.path.indexOf('/storage/') !== 0) return;
    var plug = window.cordova && cordova.plugins && cordova.plugins.fileOpener2;
    if (!plug) return;
    var ext = (d.path.split('.').pop() || '').toLowerCase(), mime = MIME[ext] || '*/*';
    var fail = function (er) { try { frame.contentWindow.postMessage({ archne: 'native-error', err: (er && er.message) || T('noApp') }, origin); } catch (x) {} };
    var opts = { error: fail, success: function () {} };
    if (d.action === 'show') plug.showOpenWithDialog('file://' + d.path, mime, opts);
    else plug.open('file://' + d.path, mime, opts);
  });
})();
</script>
</body></html>
